<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>12-Week Training Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky day tabs, then one stacked card per move. Ink line figures, equipment in signal orange. */
:root{
  --bg:#EDF1F0; --card:#FFFFFF; --fbg:#F4F7F6; --ink:#13201E; --mute:#586966; --line:#D2DBD9;
  --acc:#C9410C; --accsoft:#FBE8DD; --fig:#13201E; --prop:#B4C1BE; --foot:#C9D3D0;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --text:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --card:#152120; --fbg:#1B2B2A; --ink:#E6EEEC; --mute:#9CB0AC; --line:#2A3B39;
  --acc:#FF8A4C; --accsoft:#2C1D13; --fig:#E6EEEC; --prop:#46595A; --foot:#33474A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1413; --card:#152120; --fbg:#1B2B2A; --ink:#E6EEEC; --mute:#9CB0AC; --line:#2A3B39;
  --acc:#FF8A4C; --accsoft:#2C1D13; --fig:#E6EEEC; --prop:#46595A; --foot:#33474A; color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--text);padding-inline:16px;padding-block:0 calc(56px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin-inline:auto}
button{font:inherit;color:inherit}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.tab b{font:700 17px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.tab small{font:600 12px/1.1 var(--display);letter-spacing:.04em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.8}
.tab:focus-visible,.done input:focus-visible,.reset:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.dh{padding-block:22px 6px}
.eyebrow{margin:0 0 4px;font:600 14px/1.2 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
h1{margin:0;font:700 clamp(40px,12vw,56px)/.95 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--mute);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:14px 0 0;padding:0}
.chips li{font:600 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.prog{margin-top:14px;display:flex;align-items:center;gap:12px;font:600 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.note{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--accsoft);font-size:15px}
.note b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}

.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:30px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink);font:700 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.bh em{font:600 15px/1 var(--display);letter-spacing:.08em;color:var(--mute);font-style:normal}

.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;min-width:0}
.eh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 16px/1 var(--display)}
.eh h3{margin:0;font:700 22px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.plain{margin:3px 0 0;color:var(--mute);font-size:15px;line-height:1.35}
.done{display:flex;align-items:center;gap:6px;font:600 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;padding:4px}
.done input{width:22px;height:22px;accent-color:var(--acc);margin:0}
.rx{margin:12px 0 10px;font:700 17px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.figs figure{margin:0;background:var(--fbg);border-radius:10px;padding:6px 6px 8px;min-width:0}
.figs svg{display:block;width:100%;height:auto}
.figs figcaption{margin-top:2px;text-align:center;font:600 13px/1.1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cues{margin:14px 0 0;padding-left:20px}
.cues li{margin:0 0 6px;padding-left:2px}
.cues li::marker{color:var(--acc)}
.alt,.stop{margin:10px 0 0;font-size:15px;line-height:1.4}
.alt b,.stop b{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.stop b{color:var(--acc)}
.try{font-weight:600}
.reset{margin:8px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:600 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);cursor:pointer}

.g h2{margin:30px 0 10px;font:700 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:6px}
.g ul{margin:0;padding-left:20px}
.g li{margin-bottom:6px}
.g li::marker{color:var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
tr:last-child td{border-bottom:0}
td:first-child{font:700 17px/1.2 var(--display);white-space:nowrap}

/* figure parts */
.fl{stroke:var(--line);stroke-width:2}
.bd{stroke:var(--fig);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{opacity:.36}
.hd{fill:var(--fbg);stroke:var(--fig);stroke-width:4}
.m{fill:var(--prop)}
.mc{fill:none;stroke:var(--prop);stroke-width:3}
.w{fill:var(--acc)}
.cb{stroke:var(--prop);stroke-width:1.5;fill:none}
.ar{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ft{fill:var(--foot)}
.matr{fill:none;stroke:var(--prop);stroke-width:2;stroke-dasharray:5 4}
.figs figure:only-child{grid-column:1/-1;max-width:280px;width:100%;justify-self:center}
.dot{fill:var(--fig)}
.cut{fill:var(--fbg)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Training days"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------- figure helpers ---------- */
const pt=a=>a[0]+' '+a[1];
const DB=(x,y,w,h)=>`<rect class="w" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`;
const M=(x,y,w,h)=>`<rect class="m" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
const CB=(x1,y1,x2,y2)=>`<line class="cb" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const MAT=`<rect class="matr" x="6" y="8" width="148" height="104" rx="6"/>`;
const AR=d=>`<path class="ar" d="${d}"/>`;
const LEG=(pts,cls='bd')=>`<path class="${cls}" d="M${pts.map(pt).join('L')}"/>`;
const HEAD=(x,y,r=8)=>`<circle class="hd" cx="${x}" cy="${y}" r="${r}"/>`;

function draw(q,label){
  let o='';
  if(q.floor!==null && (!q.nofig || q.floor!==undefined)) {
    const f=q.floor===undefined?108:q.floor;
    o+=`<line class="fl" x1="4" y1="${f}" x2="156" y2="${f}"/>`;
  }
  o+=q.back||'';
  if(!q.nofig){
    if(q.k2) o+=LEG([q.p,q.k2,q.a2].concat(q.t2?[q.t2]:[]),'bd far');
    if(q.e2) o+=LEG([q.s,q.e2,q.w2],'bd far');
    o+=`<path class="bd" d="M${pt(q.s)} ${q.c?'Q'+pt(q.c):'L'} ${pt(q.p)}"/>`;
    if(q.k) o+=LEG([q.p,q.k,q.a].concat(q.t?[q.t]:[]));
    if(q.e) o+=LEG([q.s,q.e,q.w]);
    o+=HEAD(q.h[0],q.h[1]);
  }
  o+=q.front||'';
  return `<svg viewBox="${q.vb||'0 -14 160 134'}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}

/* ---------- poses ---------- */
const ST={h:[80,20],s:[80,32],p:[80,64],k:[80,87],a:[80,106],t:[88,107]};
const AF={s:[100,80],p:[66,80],e:[100,94],w:[100,107],k:[66,106],a:[42,106],t:[37,106]};

const top90=m=>{
  const X=pts=>pts.map(([x,y])=>[m?160-x:x,y]);
  return {nofig:true,floor:null,
    back:LEG(X([[74,70],[48,72],[46,98]]))+LEG(X([[86,70],[92,44],[64,44]])),
    front:`<circle class="hd" cx="80" cy="70" r="11"/>`};
};

const EX={
/* ---------- warm-up ---------- */
catcamel:{name:'Cat–camel',plain:'On hands and knees, slowly round your spine, then let it sag',rx:'6 slow cycles',
  poses:[{label:'Cat: round up',...AF,h:[110,92],c:[83,60]},{label:'Camel: sag gently',...AF,h:[113,68],c:[83,98]}],
  cues:['Hands under shoulders, knees under hips.','Breathe out as you round up. Breathe in as the belly sinks slightly.','Move smoothly and stop short of the end of your range.'],
  alt:'No floor space? Sit on a bench with hands on your knees and round and arch the same way.'},
hipflexor:{name:'Half-kneeling hip flexor stretch',plain:'Kneel on one knee and glide the hips forward',rx:'30 s per side × 2',
  poses:[
   {label:'Start',h:[68,34],s:[68,46],p:[68,80],k:[92,78],a:[92,104],t:[100,106],k2:[68,104],a2:[44,104],t2:[40,106],e:[58,62],w:[68,76],back:M(56,105,26,3)},
   {label:'Shift forward',h:[78,34],s:[78,46],p:[78,80],k:[100,78],a:[100,104],t:[108,106],k2:[78,104],a2:[54,104],t2:[50,106],e:[68,62],w:[78,76],back:M(66,105,26,3),front:AR('M60 94h12m-4-4 4 4-4 4')}],
  cues:['Fold a mat under the kneeling knee.','Tuck the tailbone under first, so your belt buckle tilts up.','Then shift forward a little. The stretch is at the front of the back-leg hip.','If your low back starts to arch or ache, you went too far.']},
ninety:{name:'90/90 hip rotation',plain:'Sit with both knees bent at right angles, then swing the knees to the other side',rx:'5 switches each way, slow',
  poses:[{label:'Right leg in front',...top90(false)},{label:'Left leg in front',...top90(true)}],
  cues:['Sit tall. Hands on the floor behind you are fine.','Lift the knees and swing both legs across. Do not push with your hands.','Stay inside a range that does not pinch the front of the hip.'],
  alt:'Both views are from above. You face the top of the picture.'},
ankle:{name:'Knee-to-wall ankle rock',plain:'Bend the front knee toward a wall without lifting the heel',rx:'10 per side',
  poses:[
   {label:'Start',h:[98,22],s:[90,34],p:[84,66],k:[100,88],a:[100,106],t:[110,107],k2:[78,88],a2:[72,106],t2:[78,107],e:[104,42],w:[119,46],back:M(122,6,8,102)},
   {label:'Knee to wall',h:[106,26],s:[98,38],p:[94,68],k:[115,84],a:[100,106],t:[110,107],k2:[82,88],a2:[72,106],t2:[78,107],e:[110,46],w:[121,50],back:M(122,6,8,102)}],
  cues:['Start with toes about 4 inches from the wall.','The heel stays on the floor the whole time.','The knee travels over the second toe, not inward. Keep the big toe pressed down so the arch holds.','Move the foot back a little each week as it gets easier.']},

/* ---------- strength A ---------- */
goblet:{name:'Goblet squat to box',plain:'Squat down until you lightly touch a box with your hips',rx:'2 × 8–10',try:'Try 10–15 lb dumbbell',
  poses:[
   {label:'Start',...ST,e:[84,47],w:[90,35],front:DB(88,29,8,12),back:M(38,88,28,20)},
   {label:'Bottom',h:[82,44],s:[77,55],p:[60,84],k:[86,82],a:[82,107],t:[90,107],e:[86,66],w:[92,58],front:DB(90,51,8,12),back:M(38,88,28,20)}],
  cues:['Hold one dumbbell upright against your chest, elbows pointing down.','Feet shoulder-width, toes turned out slightly.','Push the hips back and down, like sitting into a chair. Touch the box, do not drop onto it.','Knees follow the toes. Keep weight mid-foot and the arches lifted.','Stand by pushing the floor away.'],
  alt:'No box? Use any bench or a sturdy chair.',
  stop:'The lower back rounds at the bottom (use a higher box) or the arches cave inward.'},
rdl:{name:'Dumbbell Romanian deadlift',plain:'The hip hinge: push your hips back like closing a car door with your backside',rx:'2 × 8–10',try:'Try 10–15 lb in each hand',
  poses:[
   {label:'Start',...ST,e:[81,48],w:[83,64],front:DB(80,62,8,12)},
   {label:'Hinge',h:[106,51],s:[95,54],p:[62,62],k:[70,85],a:[64,107],t:[72,107],e:[96,70],w:[96,85],front:DB(92,84,8,12)}],
  cues:['Soft knees, shins nearly vertical the whole way down.','Dumbbells slide down the front of your thighs.','Keep a flat back from head to tailbone. Chin slightly tucked.','Go down only as far as the back stays flat (mid-shin at most).','Squeeze the glutes to stand tall.'],
  alt:'No dumbbells? Use a light barbell or a kettlebell held with both hands.',
  stop:'Back pain, or pain or tingling that travels into a leg.'},
row:{name:'Seated cable row',plain:'Pull the handle to your belly, elbows going straight back',rx:'2 × 10',try:'Start with the lightest plates',
  poses:[
   {label:'Reach',h:[52,44],s:[52,56],p:[52,90],k:[78,86],a:[98,96],t:[100,102],e:[70,58],w:[88,60],back:M(36,92,34,6)+M(102,76,4,32)+M(132,36,16,72)+CB(90,60,132,60),front:DB(87,54,3,12)},
   {label:'Pull',h:[52,44],s:[52,56],p:[52,90],k:[78,86],a:[98,96],t:[100,102],e:[43,68],w:[60,65],back:M(36,92,34,6)+M(102,76,4,32)+M(132,36,16,72)+CB(63,65,132,60),front:DB(59,59,3,12)}],
  cues:['Sit tall with the chest up and a slight bend in the knees.','Pull the elbows back to your ribs and squeeze the shoulder blades together.','Do not lean back to yank the weight.','Let the arms straighten slowly. Keep the shoulders down, not hunched.'],
  alt:'No cable row? Do a one-arm dumbbell row with your free hand and knee on a bench, or use a resistance band.'},
incline:{name:'Incline push-up',plain:'A push-up with your hands on a bench so it is easier',rx:'2 × 8–10',
  poses:[
   {label:'Top',h:[110,31],s:[102,40],p:[80,66],k:[64,85],a:[48,104],t:[55,107],e:[104,55],w:[106,70],back:M(98,71,52,37)},
   {label:'Bottom',h:[114,45],s:[106,52],p:[80,73],k:[61,89],a:[43,104],t:[50,107],e:[97,66],w:[106,70],back:M(98,71,52,37)}],
  cues:['Body in one straight line from head to heels. Ribs down, glutes tight.','Hands slightly wider than the shoulders, under the chest.','Elbows about 45° from the body, not flared out.','Lower the chest to the bench in 2 seconds, then press up. Breathe out as you press.'],
  alt:'Too hard? Use a higher surface such as a wall or a rail. No bench? Use a Smith machine bar set at hip height.',
  stop:'Pulling or a bulge at the old hernia scar.'},
deadbug:{name:'Dead bug',plain:'Lie on your back and lower the opposite arm and leg slowly',rx:'2 × 6 per side',
  poses:[
   {label:'Start',vb:'0 56 160 54',floor:103,h:[23,95],s:[34,98],p:[68,98],e:[34,84],w:[34,70],k:[68,74],a:[92,74],t:[95,70]},
   {label:'Opposite arm and leg',vb:'0 56 160 54',floor:103,h:[23,95],s:[34,98],p:[68,98],e:[34,84],w:[34,70],k:[92,92],a:[116,88],t:[121,84],e2:[22,84],w2:[8,78],k2:[68,74],a2:[92,74],t2:[95,70]}],
  cues:['Lower back gently pressed into the floor and ribs down the whole time.','Move slowly: about 3 seconds out, 3 seconds back.','Go only as far as the low back stays flat.','Breathe out as the arm and leg extend.'],
  alt:'Too hard? Lower only the legs, heel taps to the floor, keeping the arms up.',
  stop:'The low back arches off the floor, or pulling at the hernia scar.'},
sideplank:{name:'Side plank',plain:'Prop on one forearm and hold your body in a straight line',rx:'2 × 20–30 s per side',
  poses:[{label:'Hold',h:[25,86],s:[36,88],p:[69,95],k:[93,100],a:[116,105],t:[122,107],e:[36,104],w:[50,104],e2:[36,72],w2:[36,57]}],
  cues:['Elbow directly under the shoulder.','Stack the feet, or bend the knees for an easier version.','Lift the hips until shoulders, hips and ankles line up.','Keep breathing. Do not hold your breath.'],
  stop:'Pulling or a bulge at the hernia scar, or back pain.'},
shortfoot:{name:'Short-foot hold',plain:'Lift the arch of your foot without curling the toes',rx:'2 × 10 holds of 5 s per foot',
  poses:[
   {label:'Relaxed',nofig:true,floor:96,back:`<path class="ft" d="M40 96Q38 78 52 72L70 64Q104 66 128 84Q134 90 130 96Z"/><path class="cut" d="M52 96Q86 90 120 96Z"/>`+LEG([[64,64],[64,14]]),front:`<circle class="dot" cx="46" cy="96" r="3"/><circle class="dot" cx="122" cy="96" r="3"/>`},
   {label:'Short foot',nofig:true,floor:96,back:`<path class="ft" d="M40 96Q38 78 52 72L70 64Q104 66 128 84Q134 90 130 96Z"/><path class="cut" d="M52 96Q86 58 120 96Z"/>`+LEG([[64,64],[64,14]]),front:`<circle class="dot" cx="46" cy="96" r="3"/><circle class="dot" cx="122" cy="96" r="3"/>`+AR('M88 50v-12m-4 4 4-4 4 4')}],
  cues:['Foot flat on the floor. Weight on three points: heel, base of the big toe, base of the little toe.','Slide the ball of the foot toward the heel, as if shortening the foot. Do not curl the toes.','The arch rises a little. Toes stay long and relaxed.','Hold 5 seconds, then relax. Learn it seated, then try it standing.'],
  alt:'This is the foot muscle drill that supports the arch. Do it in socks or barefoot.'},
calf:{name:'Calf raise',plain:'Rise onto the balls of your feet and lower slowly',rx:'2 × 12',
  poses:[
   {label:'Down',...ST,e:[80,48],w:[80,62]},
   {label:'Up',h:[80,11],s:[80,23],p:[80,55],k:[80,78],a:[80,97],t:[88,107],e:[80,39],w:[80,53],front:AR('M62 96v-14m-4 4 4-4 4 4')}],
  cues:['Rise straight up over the big toe. Do not roll onto the outside of the foot.','Pause 1 second at the top, then lower over 3 seconds.','Fingertips on a wall or rail for balance.','Hold the short-foot arch while you rise.'],
  stop:'Pain along the inner ankle, or one heel does not tilt slightly inward as you rise. Mention it to a podiatrist.'},

/* ---------- strength B ---------- */
stepup:{name:'Step-up',plain:'Step onto a low box and stand tall, then step back down',rx:'2 × 8 per leg',try:'Bodyweight first',
  poses:[
   {label:'Start',h:[76,16],s:[76,28],p:[76,60],k:[96,66],a:[102,89],t:[110,91],k2:[76,84],a2:[76,106],t2:[84,107],e:[76,44],w:[76,58],back:M(98,92,36,16)},
   {label:'Top',h:[106,-3],s:[106,9],p:[106,41],k:[106,65],a:[106,88],t:[114,90],k2:[122,50],a2:[122,74],t2:[130,75],e:[106,25],w:[106,40],back:M(98,92,36,16)}],
  cues:['Whole foot on the box. Knee tracks over the middle toes.','Push through the front heel. Do not bounce off the back foot.','Stand fully tall at the top, then lower for 3 seconds.','Use a rail or wall for balance if you wobble.'],
  alt:'Box height: knee height or lower (6–12 inches). No box? Use the bottom step of a staircase or a low bench.',
  stop:'The knee drifts inward, or the arch collapses on the stepping foot.'},
bridge:{name:'Glute bridge',plain:'Lie on your back and lift your hips by squeezing your glutes',rx:'2 × 10',
  poses:[
   {label:'Down',vb:'0 62 160 50',floor:104,h:[22,97],s:[34,98],p:[68,98],e:[50,99],w:[64,100],k:[84,78],a:[98,101],t:[106,102]},

/* ---------- guide ---------- */
const GUIDE=`
<header class="dh"><p class="eyebrow">Reference</p><h1>Guide</h1><p class="lede">Read once. Come back when something hurts or you are ready to progress.</p></header>
<div class="g">
<h2>Today at the gym</h2>
<ul>
<li>You need: light dumbbells (5–25 lb), a cable machine, a lat pulldown, a bench or low box, and a mat.</li>
<li>Ask the front desk where the dumbbell rack, cable stations and mats are. Every move lists a swap if something is missing.</li>
<li>Wear stable, cushioned shoes. Barefoot only for the short-foot drill.</li>
</ul>
<h2>How hard</h2>
<ul>
<li><b>Effort 5–6 / 10</b> means you could still do 4–5 more clean reps. Stop each set there.</li>
<li><b>Cardio effort 3–4 / 10</b> means you can speak in full sentences. For you that is roughly 108–126 beats per minute.</li>
</ul>
<h2>12-week progression</h2>
<div class="tw"><table>
<thead><tr><th>Weeks</th><th>Strength</th><th>Wednesday cardio</th></tr></thead>
<tbody>
<tr><td>1–4</td><td>2 sets, effort 5–6 / 10, perfect form</td><td>30 min</td></tr>
<tr><td>5–8</td><td>3 sets, effort 6–7 / 10</td><td>35–45 min</td></tr>
<tr><td>9–12</td><td>Same sets, add about 5% load when all reps are clean</td><td>45–50 min. Optionally add 4 × 3 min harder efforts once cleared</td></tr>
</tbody></table></div>
<p style="margin:10px 0 0;color:var(--mute);font-size:15px">Do not add load and volume in the same week. Your monthly 18-mile ride becomes every two weeks after week 4.</p>
<h2>Rules that matter most</h2>
<ul>
<li><b>Pain that changes how you move:</b> stop that move and use the swap. Do not push through.</li>
<li><b>Back:</b> soreness lasting over 48 hours means halve that move's load next session. Leg weakness, numbness, or any bladder or bowel change is urgent.</li>
<li><b>Hernia scar:</b> breathe out on effort, never hold your breath. A new bulge or pain there means stop and get it checked.</li>
<li><b>Foot:</b> no running or jumping for now. Adult-onset flatfoot is worth a podiatry visit.</li>
<li><b>Statin:</b> muscle pain beyond normal training soreness, dark urine, or unusual weakness means call your physician.</li>
</ul>
<h2>Between sessions</h2>
<ul>
<li>Walk 20–30 minutes on a non-gym day when you can. It adds up for waist and lipids.</li>
<li>Diet matters at least as much as training for the waist. Oats, beans and fruit help LDL. Cut sugary drinks and keep alcohol low.</li>
<li>Measure your waist at the navel once a month and write it down. Bring your lipid and blood pressure numbers to week 12.</li>
</ul>
</div>`;

/* ---------- build ---------- */
const store={get(){try{return JSON.parse(localStorage.getItem('plan-done')||'{}')}catch(e){return {}}},
  set(o){try{localStorage.setItem('plan-done',JSON.stringify(o))}catch(e){}}};
let done=store.get();

function card(day,id,i){
  const e=EX[id],key=day+'-'+id;
  const figs=e.poses.map(q=>`<figure>${draw(q,e.name+': '+q.label)}<figcaption>${q.label}</figcaption></figure>`).join('');
  return `<article class="ex">
  <div class="eh"><span class="n">${i+1}</span><div><h3>${e.name}</h3><p class="plain">${e.plain}</p></div>
  <label class="done"><input type="checkbox" data-k="${key}" ${done[key]?'checked':''}>Done</label></div>
  <p class="rx">${e.rx}${e.try?` <span class="try" style="color:var(--mute)">· ${e.try}</span>`:''}</p>
  <div class="figs">${figs}</div>
  <ul class="cues">${e.cues.map(c=>`<li>${c}</li>`).join('')}</ul>
  ${e.alt?`<p class="alt"><b>Swap / note</b> ${e.alt}</p>`:''}
  ${e.stop?`<p class="stop"><b>Stop if</b> ${e.stop}</p>`:''}
  </article>`;
}
function dayHTML(k){
  const d=DAYS[k];let total=0;
  const blocks=d.blocks.map(b=>{total+=b.ex.length;return `<h2 class="bh"><span>${b.t}</span><em>${b.m}</em></h2>`+b.ex.map((id,i)=>card(k,id,i)).join('')}).join('');
  return `<header class="dh"><p class="eyebrow">${d.eyebrow}</p><h1>${d.name}</h1><p class="lede">${d.lede}</p>
  <ul class="chips">${d.chips.map(c=>`<li>${c}</li>`).join('')}</ul>
  <div class="prog"><span class="pc" data-t="${total}">0 of ${total} done</span><div class="bar"><i></i></div></div>
  ${d.note?`<p class="note">${d.note}</p>`:''}</header>${blocks}
  <p class="lede" style="margin-top:20px">${d.after}</p>
  <button class="reset" type="button" data-day="${k}">Reset checkmarks</button>`;
}

const tabsEl=document.getElementById('tabs'),mainEl=document.getElementById('main');
const order=['tue','wed','fri','guide'];
tabsEl.innerHTML=order.map(k=>k==='guide'
  ?`<button class="tab" role="tab" data-t="guide" aria-selected="false"><b>Guide</b><small>Rules</small></button>`
  :`<button class="tab" role="tab" data-t="${k}" aria-selected="false"><b>${DAYS[k].tab}</b><small>${DAYS[k].sub}</small></button>`).join('');
mainEl.innerHTML=order.map(k=>`<section id="p-${k}" hidden>${k==='guide'?GUIDE:dayHTML(k)}</section>`).join('');

function progress(k){
  const sec=document.getElementById('p-'+k);if(!sec)return;
  const boxes=sec.querySelectorAll('input[type=checkbox]');
  if(!boxes.length)return;
  const n=[...boxes].filter(b=>b.checked).length;
  const pc=sec.querySelector('.pc');
  pc.textContent=n+' of '+boxes.length+' done';
  sec.querySelector('.bar i').style.width=(100*n/boxes.length)+'%';
}
function show(k){
  order.forEach(o=>{document.getElementById('p-'+o).hidden=o!==k});
  tabsEl.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===k));
  try{history.replaceState(null,'','#'+k)}catch(e){}
  window.scrollTo(0,0);
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.t)});
mainEl.addEventListener('change',e=>{
  const c=e.target.closest('input[data-k]');if(!c)return;
  if(c.checked)done[c.dataset.k]=1;else delete done[c.dataset.k];
  store.set(done);progress(c.dataset.k.split('-')[0]);
});
mainEl.addEventListener('click',e=>{
  const r=e.target.closest('.reset');if(!r)return;
  const k=r.dataset.day;
  document.querySelectorAll('#p-'+k+' input[type=checkbox]').forEach(c=>{c.checked=false;delete done[c.dataset.k]});
  store.set(done);progress(k);
});
['tue','wed','fri'].forEach(progress);

const byDay=['tue','tue','tue','wed','fri','fri','tue'];
const h=(location.hash||'').slice(1);
show(order.includes(h)?h:byDay[new Date().getDay()]);
window.scrollTo(0,0);
</script>
